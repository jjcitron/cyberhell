<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyberhell MIDI Composer - harness</title>
<style>
  html, body { margin: 0; background: #05080b; color: #00ffcc; font: 12px "Courier New", monospace; height: 100%; }
  #shell { display: flex; flex-direction: column; height: 100vh; }
  #fake-level { flex: 0 0 auto; padding: 6px 10px; border-bottom: 1px solid #123; display: flex; gap: 16px; }
  #panel-host { flex: 1 1 auto; min-height: 0; }
  pre { margin: 0; color: #4b7a86; }
</style>
</head>
<body>
<div id="shell">
  <div id="fake-level">
    <span>STUB EDITOR SHELL</span>
    <pre id="level-json">level.music: (none)</pre>
  </div>
  <div id="panel-host"></div>
</div>

<script>
  // The editor page owns the synth for previews only - no attract theme here.
  window.CYBER_NO_TITLE_THEME = true;
</script>
<script src="../js/webaudio-tinysynth.js"></script>
<script src="../js/cyber-midi-player.js"></script>
<script src="../js/editor/midi_writer.js"></script>
<script>
  /* Stub CyberEditor: same surface the real shell exposes to panels. */
  (function () {
    const listeners = {};
    const level = { file: 'levelPacks/pack1/json7.json', name: 'Pack 1 (Doom II) - Level 7 (MAP07)' };
    const saved = [];
    const toasts = [];
    window.CyberEditor = {
      level: level,
      pack: { id: 'pack1' },
      on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); },
      emit(evt, arg) { (listeners[evt] || []).forEach(f => f(arg)); },
      apply(mutator, label) {
        mutator(level);
        document.getElementById('level-json').textContent =
          'level.music: ' + JSON.stringify(level.music, (k, v) =>
            (k === 'data' && typeof v === 'string') ? ('<base64 ' + v.length + ' chars>') : v);
        window.__lastApply = label;
        this.emit('level-changed', level);
      },
      registerPanel(spec) {
        const host = document.getElementById('panel-host');
        window.__panelSpec = { id: spec.id, title: spec.title, side: spec.side };
        spec.mount(host);
        return host;
      },
      storage: {
        saveMidi(packId, name, bytes) { saved.push({ packId, name, len: bytes.length }); return null; },
        listMidi() { return saved.slice(); }
      },
      toast(m) { toasts.push(m); console.log('[toast]', m); },
      __saved: saved, __toasts: toasts
    };
    window.dispatchEvent(new Event('cybereditor-ready'));
  })();
</script>
<script src="../js/editor/midi_composer.js"></script>
</body>
</html>
